<!doctype html>
<html lang="it" style="background:#07060f">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Russo Flashcards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --bg: #07060f;
    --panel: rgba(20, 18, 40, 0.55);
    --panel-solid: #12102a;
    --text: #ecebff;
    --muted: #8f8bb8;
    --border: rgba(140, 120, 255, 0.22);
    --cyan: #22e6ff;
    --magenta: #ff2bd6;
    --violet: #8b5cff;
    --good: #39ff9f;
    --bad: #ff3d6e;
    --glow-cyan: 0 0 8px rgba(34, 230, 255, .55), 0 0 24px rgba(34, 230, 255, .25);
    --glow-magenta: 0 0 8px rgba(255, 43, 214, .55), 0 0 24px rgba(255, 43, 214, .25);
    --display: "Unbounded", -apple-system, BlinkMacSystemFont, sans-serif;
    --body: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0; min-height: 100vh; color: var(--text); font: 16px/1.5 var(--body);
    background:
      radial-gradient(900px 500px at 10% -10%, rgba(255, 43, 214, .18), transparent 60%),
      radial-gradient(800px 500px at 110% 10%, rgba(34, 230, 255, .16), transparent 60%),
      radial-gradient(700px 500px at 50% 120%, rgba(139, 92, 255, .20), transparent 60%),
      var(--bg);
    background-attachment: fixed;
  }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image:
      linear-gradient(rgba(140, 120, 255, .06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(140, 120, 255, .06) 1px, transparent 1px);
    background-size: 40px 40px;
    mask-image: radial-gradient(ellipse at center, #000 30%, transparent 80%);
    -webkit-mask-image: radial-gradient(ellipse at center, #000 30%, transparent 80%);
  }
  main { position: relative; z-index: 1; max-width: 640px; margin: 0 auto; padding: 32px 16px 56px; }

  h1 {
    font-family: var(--display); font-weight: 800; font-size: 1.9rem; letter-spacing: .02em;
    margin: 0 0 4px; text-align: center;
    background: linear-gradient(90deg, var(--cyan), var(--violet) 50%, var(--magenta));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 12px rgba(139, 92, 255, .55));
  }
  .brand { display: flex; flex-direction: column; align-items: center; gap: 12px; margin-bottom: 14px; }
  .brand h1 { font-size: 2.4rem; margin: 0; line-height: 1.1; }
  .langs {
    display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 999px;
    border: 1px solid rgba(139, 92, 255, .45); background: rgba(20, 18, 40, .6);
    box-shadow: 0 0 12px rgba(139, 92, 255, .35), inset 0 0 12px rgba(139, 92, 255, .12);
  }
  .flag { font-size: 1.25rem; line-height: 1; filter: drop-shadow(0 0 6px rgba(255, 255, 255, .25)); }
  .lang { font: 600 .75rem var(--display); letter-spacing: .12em; }
  .langs .lang:nth-of-type(2) { color: var(--cyan); text-shadow: var(--glow-cyan); }
  .langs .lang:nth-of-type(4) { color: var(--magenta); text-shadow: var(--glow-magenta); }
  .arrow {
    position: relative; width: 34px; height: 2px; margin: 0 2px; border-radius: 1px;
    background: linear-gradient(90deg, var(--cyan), var(--magenta));
    box-shadow: 0 0 8px rgba(139, 92, 255, .8);
  }
  .arrow::after {
    content: ""; position: absolute; right: -1px; top: -4px; width: 8px; height: 8px;
    border-top: 2px solid var(--magenta); border-right: 2px solid var(--magenta);
    transform: rotate(45deg); filter: drop-shadow(0 0 4px var(--magenta));
  }
  .sub { color: var(--muted); margin: 0 0 28px; text-align: center; letter-spacing: .08em; text-transform: uppercase; font-size: .78rem; }
  .hidden { display: none !important; }

  .panel {
    background: var(--panel); border: 1px solid var(--border); border-radius: 18px;
    padding: 22px; margin-bottom: 16px;
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 0 0 1px rgba(255,255,255,.02) inset, 0 10px 40px rgba(0,0,0,.45), 0 0 30px rgba(139, 92, 255, .08);
  }

  button {
    font: 500 1rem var(--body); cursor: pointer; border-radius: 12px; padding: 11px 16px;
    border: 1px solid var(--border); background: rgba(255,255,255,.03); color: var(--text);
    transition: border-color .15s, box-shadow .15s, transform .1s, background .15s, color .15s;
  }
  button:hover:not(:disabled) { border-color: var(--cyan); box-shadow: var(--glow-cyan); }
  button:active:not(:disabled) { transform: scale(.98); }
  button:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
  button:disabled { opacity: .45; cursor: default; }
  button.primary {
    border: none; color: #0a0614; font-weight: 700; letter-spacing: .02em;
    background: linear-gradient(90deg, var(--cyan), var(--magenta));
    box-shadow: 0 0 14px rgba(34, 230, 255, .45), 0 0 28px rgba(255, 43, 214, .3);
  }
  button.primary:hover:not(:disabled) { box-shadow: 0 0 20px rgba(34, 230, 255, .7), 0 0 40px rgba(255, 43, 214, .5); }
  button.link {
    border: none; background: none; color: var(--muted); padding: 6px 10px; font-size: .9rem;
  }
  button.link:hover { color: var(--cyan); box-shadow: none; text-shadow: var(--glow-cyan); }
  button small { opacity: .6; font-weight: 400; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .row > button { flex: 1; }

  #drop {
    border: 2px dashed rgba(34, 230, 255, .35); padding: 48px 16px;
    text-align: center; color: var(--muted); transition: border-color .2s, box-shadow .2s;
  }
  #drop > div:first-child { font-family: var(--display); color: var(--text); font-size: 1.1rem; margin-bottom: 4px; }
  #drop.over { border-color: var(--magenta); box-shadow: var(--glow-magenta); }
  #drop button { margin-top: 18px; }

  .seg {
    display: flex; gap: 4px; padding: 4px; border: 1px solid var(--border); border-radius: 14px;
    background: rgba(0,0,0,.25); margin-bottom: 16px;
  }
  .seg button { flex: 1; border: 1px solid transparent; border-radius: 10px; background: transparent; color: var(--muted); }
  .seg button:hover:not(.on) { box-shadow: none; color: var(--text); border-color: transparent; }
  .seg button.on {
    color: var(--cyan); border-color: var(--cyan); background: rgba(34, 230, 255, .08);
    box-shadow: var(--glow-cyan); text-shadow: 0 0 8px rgba(34, 230, 255, .7); font-weight: 600;
  }
  .label { font-size: .72rem; color: var(--muted); margin: 0 0 8px; letter-spacing: .12em; text-transform: uppercase; }

  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; text-align: center; padding: 18px 10px; }
  .stats b { display: block; font: 800 1.7rem var(--display); }
  .stats span { font-size: .7rem; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
  .stats div:nth-child(1) b { color: var(--magenta); text-shadow: var(--glow-magenta); }
  .stats div:nth-child(2) b { color: var(--cyan); text-shadow: var(--glow-cyan); }
  .stats div:nth-child(3) b { color: var(--good); text-shadow: 0 0 8px rgba(57,255,159,.55), 0 0 24px rgba(57,255,159,.25); }
  .stats div:nth-child(4) b { color: var(--text); text-shadow: 0 0 10px rgba(236,235,255,.35); }

  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; color: var(--muted); font-size: .9rem; font-variant-numeric: tabular-nums; }
  .bar { height: 6px; background: rgba(255,255,255,.06); border-radius: 3px; overflow: hidden; margin-bottom: 18px; }
  .bar > div {
    height: 100%; width: 0; border-radius: 3px; transition: width .3s ease;
    background: linear-gradient(90deg, var(--cyan), var(--magenta));
    box-shadow: 0 0 10px rgba(34, 230, 255, .8);
  }

  .card {
    min-height: 240px; display: flex; flex-direction: column; justify-content: center;
    align-items: center; text-align: center; cursor: pointer; user-select: none;
    border-color: rgba(34, 230, 255, .3);
    box-shadow: 0 10px 40px rgba(0,0,0,.45), 0 0 30px rgba(34, 230, 255, .12), inset 0 0 40px rgba(139, 92, 255, .06);
    animation: cardIn .3s ease;
  }
  @keyframes cardIn { from { opacity: 0; transform: translateY(8px) scale(.98); } to { opacity: 1; transform: none; } }
  .prompt {
    font: 600 2.1rem/1.25 var(--display); overflow-wrap: anywhere; color: #fff;
    text-shadow: 0 0 10px rgba(34, 230, 255, .6), 0 0 30px rgba(139, 92, 255, .4);
  }
  .pron { color: var(--muted); font-style: italic; margin-top: 8px; }
  .answer { margin-top: 22px; padding-top: 22px; width: 100%; position: relative; animation: cardIn .25s ease; }
  .answer::before {
    content: ""; position: absolute; top: 0; left: 15%; right: 15%; height: 1px;
    background: linear-gradient(90deg, transparent, var(--magenta), transparent);
    box-shadow: 0 0 8px var(--magenta);
  }
  .answer .txt { font: 600 1.5rem var(--display); color: var(--magenta); text-shadow: var(--glow-magenta); }
  .hint { color: var(--muted); font-size: .82rem; margin-top: 18px; }

  .opts { display: grid; gap: 10px; }
  .opts button { text-align: left; padding: 15px 18px; background: var(--panel); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  .opts button kbd {
    display: inline-block; min-width: 1.6em; margin-right: 10px; font: 600 .8rem var(--display);
    color: var(--cyan); text-shadow: 0 0 6px rgba(34, 230, 255, .7);
  }
  .opts button.good {
    border-color: var(--good); color: var(--good); font-weight: 600; background: rgba(57, 255, 159, .08);
    box-shadow: 0 0 10px rgba(57,255,159,.5), 0 0 28px rgba(57,255,159,.25); text-shadow: 0 0 8px rgba(57,255,159,.6);
    opacity: 1;
  }
  .opts button.bad {
    border-color: var(--bad); color: var(--bad); background: rgba(255, 61, 110, .08);
    box-shadow: 0 0 10px rgba(255,61,110,.5), 0 0 28px rgba(255,61,110,.25); opacity: 1;
    animation: shake .3s;
  }
  .opts button.good kbd, .opts button.bad kbd { color: inherit; }
  @keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
  .btn-good { border-color: rgba(57,255,159,.5) !important; color: var(--good); }
  .btn-good:hover { box-shadow: 0 0 10px rgba(57,255,159,.5), 0 0 28px rgba(57,255,159,.25) !important; border-color: var(--good) !important; }
  .btn-bad { border-color: rgba(255,61,110,.5) !important; color: var(--bad); }
  .btn-bad:hover { box-shadow: 0 0 10px rgba(255,61,110,.5), 0 0 28px rgba(255,61,110,.25) !important; border-color: var(--bad) !important; }

  .missed { list-style: none; padding: 0; margin: 14px 0 0; }
  .missed li { padding: 10px 0; border-top: 1px solid var(--border); }
  .missed b { color: var(--magenta); text-shadow: 0 0 8px rgba(255, 43, 214, .5); }
  .missed small { color: var(--muted); font-style: italic; }
  .big {
    font: 800 3rem var(--display); text-align: center;
    background: linear-gradient(90deg, var(--cyan), var(--magenta));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 14px rgba(139, 92, 255, .6));
  }
  .center { text-align: center; }
  .error { color: var(--bad); margin-top: 12px; text-shadow: 0 0 8px rgba(255,61,110,.5); }

  @media (max-width: 420px) {
    h1 { font-size: 1.5rem; }
    .prompt { font-size: 1.6rem; }
    .stats b { font-size: 1.25rem; }
    .stats span { font-size: .6rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<main>
  <header class="brand">
    <h1>Русский</h1>
    <div class="langs" aria-label="Russo verso Italiano">
      <span class="flag">🇷🇺</span><span class="lang">RU</span>
      <span class="arrow" aria-hidden="true"></span>
      <span class="lang">IT</span><span class="flag">🇮🇹</span>
    </div>
  </header>
  <p class="sub" id="subtitle">Impara il tuo vocabolario</p>

  <!-- Load screen -->
  <section id="screen-load" class="hidden">
    <div id="drop" class="panel">
      <div>Trascina qui il file CSV</div>
      <div style="font-size:.85rem">(colonne: Cirillico, Traduzione, Pronuncia)</div>
      <button class="primary" id="pick">Scegli file CSV</button>
      <input type="file" id="file" accept=".csv,text/csv" hidden>
      <div class="error hidden" id="load-error"></div>
    </div>
    <div class="center"><button class="link hidden" id="cancel-load">Annulla</button></div>
  </section>

  <!-- Menu -->
  <section id="screen-menu" class="hidden">
    <div class="panel stats">
      <div><b id="st-due">0</b><span>da ripassare</span></div>
      <div><b id="st-new">0</b><span>nuove</span></div>
      <div><b id="st-learned">0</b><span>imparate</span></div>
      <div><b id="st-total">0</b><span>totale</span></div>
    </div>
    <div class="panel">
      <p class="label">Modalità</p>
      <div class="seg" id="seg-mode">
        <button data-v="flash">Flashcard</button>
        <button data-v="quiz">Quiz a scelta</button>
      </div>
      <p class="label">Direzione</p>
      <div class="seg" id="seg-dir">
        <button data-v="ru-it">Russo → Italiano</button>
        <button data-v="it-ru">Italiano → Russo</button>
      </div>
      <div class="row" style="margin-top:8px">
        <button class="primary" id="start">Inizia</button>
        <button id="start-all">Ripassa tutto</button>
      </div>
      <p class="hint center" id="menu-hint"></p>
    </div>
    <div class="center">
      <button class="link" id="reload">Carica nuovo CSV</button>
      <button class="link" id="reset">Azzera progressi</button>
    </div>
  </section>

  <!-- Session -->
  <section id="screen-session" class="hidden">
    <div class="topbar">
      <span id="progress-text"></span>
      <button class="link" id="quit">Esci</button>
    </div>
    <div class="bar"><div id="progress-bar"></div></div>

    <div id="flash" class="hidden">
      <div class="panel card" id="flash-card">
        <div class="prompt" id="f-prompt"></div>
        <div class="pron" id="f-pron"></div>
        <div class="answer hidden" id="f-answer">
          <div class="txt" id="f-ans-txt"></div>
          <div class="pron" id="f-ans-pron"></div>
        </div>
        <div class="hint" id="f-hint">Clicca o premi Spazio per girare</div>
      </div>
      <div class="row hidden" id="f-buttons">
        <button class="btn-bad" id="f-no">Non lo sapevo <small>(1)</small></button>
        <button class="btn-good" id="f-yes">Lo sapevo <small>(2)</small></button>
      </div>
    </div>

    <div id="quiz" class="hidden">
      <div class="panel card" id="quiz-card" style="cursor:default">
        <div class="prompt" id="q-prompt"></div>
        <div class="pron" id="q-pron"></div>
      </div>
      <div class="opts" id="q-opts"></div>
      <div class="pron center hidden" id="q-feedback" style="margin:12px 0"></div>
      <div class="row hidden" id="q-next-row" style="margin-top:12px">
        <button class="primary" id="q-next">Avanti <small>(Invio)</small></button>
      </div>
    </div>
  </section>

  <!-- Summary -->
  <section id="screen-summary" class="hidden">
    <div class="panel">
      <p class="center label">Sessione completata</p>
      <div class="big" id="sum-score"></div>
      <p class="center hint" id="sum-text"></p>
      <ul class="missed" id="sum-missed"></ul>
    </div>
    <div class="row">
      <button class="primary" id="back-menu">Torna al menu</button>
    </div>
  </section>
</main>

<script>
(function () {
  "use strict";

  const KEY_CARDS = "ruapp.cards";
  const KEY_PROGRESS = "ruapp.progress";
  const KEY_PREFS = "ruapp.prefs";
  const NEW_PER_SESSION = 10;
  const DAY = 86400000;
  // Days until next review, indexed by box (1..5).
  const INTERVALS = [0, 0, 1, 3, 7, 21];

  // ---------- storage ----------
  function load(key, fallback) {
    try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
    catch (e) { return fallback; }
  }
  function save(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* ignore */ }
  }

  let cards = load(KEY_CARDS, []);        // [{id, ru, it, pron}]
  let progress = load(KEY_PROGRESS, {});  // {id: {"ru-it": {box, due}, "it-ru": {...}}}
  let prefs = Object.assign({ mode: "flash", dir: "ru-it" }, load(KEY_PREFS, {}));

  // ---------- CSV ----------
  function parseCSV(text) {
    text = text.replace(/^﻿/, "");
    const rows = [];
    let row = [], field = "", inQuotes = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (inQuotes) {
        if (c === '"') {
          if (text[i + 1] === '"') { field += '"'; i++; }
          else inQuotes = false;
        } else field += c;
      } else if (c === '"') inQuotes = true;
      else if (c === ",") { row.push(field); field = ""; }
      else if (c === "\n" || c === "\r") {
        if (c === "\r" && text[i + 1] === "\n") i++;
        row.push(field); rows.push(row); row = []; field = "";
      } else field += c;
    }
    if (field !== "" || row.length) { row.push(field); rows.push(row); }
    return rows;
  }

  function rowsToCards(rows) {
    const out = [], seen = new Set();
    rows.slice(1).forEach(r => {
      const ru = (r[0] || "").trim(), it = (r[1] || "").trim(), pron = (r[2] || "").trim();
      if (!ru || !it) return;
      const id = ru + "␟" + it;
      if (seen.has(id)) return;
      seen.add(id);
      out.push({ id, ru, it, pron });
    });
    return out;
  }

  // ---------- SRS ----------
  function startOfToday() { const d = new Date(); d.setHours(0, 0, 0, 0); return d.getTime(); }
  function getState(card, dir) { return (progress[card.id] || {})[dir]; }
  function isDue(card, dir) { const s = getState(card, dir); return !!s && s.due <= Date.now(); }
  function isNew(card, dir) { return !getState(card, dir); }

  function grade(card, dir, correct) {
    const s = getState(card, dir) || { box: 0, due: 0 };
    const box = correct ? Math.min(5, Math.max(1, s.box + 1)) : 1;
    const days = INTERVALS[box];
    const due = days === 0 ? Date.now() : startOfToday() + days * DAY;
    progress[card.id] = progress[card.id] || {};
    progress[card.id][dir] = { box, due };
    save(KEY_PROGRESS, progress);
  }

  // ---------- helpers ----------
  const $ = id => document.getElementById(id);
  function shuffle(a) {
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }
  function show(screen) {
    ["load", "menu", "session", "summary"].forEach(s =>
      $("screen-" + s).classList.toggle("hidden", s !== screen));
    current = screen;
  }
  let current = null;

  function replayAnim(el) { el.style.animation = "none"; void el.offsetWidth; el.style.animation = ""; }

  function promptOf(card, dir) {
    return dir === "ru-it"
      ? { q: card.ru, qPron: card.pron, a: card.it, aPron: "" }
      : { q: card.it, qPron: "", a: card.ru, aPron: card.pron };
  }

  // ---------- load screen ----------
  function handleFile(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      const newCards = rowsToCards(parseCSV(String(reader.result)));
      if (!newCards.length) {
        $("load-error").textContent = "Nessuna parola trovata. Controlla che il file abbia 3 colonne e una riga di intestazione.";
        $("load-error").classList.remove("hidden");
        return;
      }
      $("load-error").classList.add("hidden");
      cards = newCards;
      save(KEY_CARDS, cards);
      renderMenu();
      show("menu");
    };
    reader.readAsText(file, "utf-8");
  }

  $("pick").onclick = () => $("file").click();
  $("file").onchange = e => { handleFile(e.target.files[0]); e.target.value = ""; };
  const drop = $("drop");
  ["dragenter", "dragover"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); }));
  ["dragleave", "drop"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("over"); }));
  drop.addEventListener("drop", e => handleFile(e.dataTransfer.files[0]));
  window.addEventListener("dragover", e => e.preventDefault());
  window.addEventListener("drop", e => e.preventDefault());
  $("cancel-load").onclick = () => show("menu");

  // ---------- menu ----------
  function setSeg(segId, value) {
    $(segId).querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.v === value));
  }
  function bindSeg(segId, key) {
    $(segId).querySelectorAll("button").forEach(b => b.onclick = () => {
      prefs[key] = b.dataset.v; save(KEY_PREFS, prefs); renderMenu();
    });
  }
  bindSeg("seg-mode", "mode");
  bindSeg("seg-dir", "dir");

  function renderMenu() {
    setSeg("seg-mode", prefs.mode);
    setSeg("seg-dir", prefs.dir);
    const d = prefs.dir;
    const due = cards.filter(c => isDue(c, d)).length;
    const nw = cards.filter(c => isNew(c, d)).length;
    const learned = cards.filter(c => { const s = getState(c, d); return s && s.box >= 4; }).length;
    $("st-due").textContent = due;
    $("st-new").textContent = nw;
    $("st-learned").textContent = learned;
    $("st-total").textContent = cards.length;
    $("subtitle").textContent = cards.length + " parole caricate";
    const inSession = due + Math.min(NEW_PER_SESSION, nw);
    $("start").disabled = inSession === 0;
    $("menu-hint").textContent = inSession === 0
      ? "Niente da ripassare oggi 🎉 Usa “Ripassa tutto” per esercitarti comunque."
      : "Sessione: " + due + " da ripassare + " + Math.min(NEW_PER_SESSION, nw) + " nuove";
  }

  $("reload").onclick = () => { $("cancel-load").classList.remove("hidden"); show("load"); };
  $("reset").onclick = () => {
    if (confirm("Vuoi davvero azzerare tutti i progressi?")) {
      progress = {}; save(KEY_PROGRESS, progress); renderMenu();
    }
  };

  // ---------- session ----------
  let session = null;

  function startSession(all) {
    const dir = prefs.dir;
    let list;
    if (all) list = shuffle(cards.slice());
    else {
      const due = cards.filter(c => isDue(c, dir));
      const nw = shuffle(cards.filter(c => isNew(c, dir))).slice(0, NEW_PER_SESSION);
      list = shuffle(due.concat(nw));
    }
    if (!list.length) return;
    session = {
      dir, mode: prefs.mode, queue: list, total: list.length,
      done: 0, correct: 0, missed: new Map(), answered: false, card: null
    };
    show("session");
    $("flash").classList.toggle("hidden", session.mode !== "flash");
    $("quiz").classList.toggle("hidden", session.mode !== "quiz");
    next();
  }

  $("start").onclick = () => startSession(false);
  $("start-all").onclick = () => startSession(true);
  $("quit").onclick = () => { session = null; renderMenu(); show("menu"); };

  function updateProgress() {
    $("progress-text").textContent = session.done + " / " + session.total + "  ·  ✓ " + session.correct;
    $("progress-bar").style.width = (100 * session.done / session.total) + "%";
  }

  function next() {
    if (!session.queue.length) return finish();
    session.card = session.queue.shift();
    session.answered = false;
    updateProgress();
    if (session.mode === "flash") renderFlash(); else renderQuiz();
  }

  // Record an answer. The first answer to a card counts for the score;
  // wrong cards are re-queued a few positions later until answered correctly.
  function answer(correct) {
    const s = session, c = s.card;
    s.answered = true;
    grade(c, s.dir, correct);
    const firstTry = !c._retry;
    if (correct) {
      if (firstTry) s.correct++;
      s.done++;
      delete c._retry;
    } else {
      s.missed.set(c.id, c);
      const retry = Object.assign({}, c, { _retry: true });
      s.queue.splice(Math.min(3, s.queue.length), 0, retry);
    }
    updateProgress();
  }

  // ----- flashcards -----
  function renderFlash() {
    const p = promptOf(session.card, session.dir);
    $("f-prompt").textContent = p.q;
    $("f-pron").textContent = p.qPron;
    $("f-ans-txt").textContent = p.a;
    $("f-ans-pron").textContent = p.aPron;
    $("f-answer").classList.add("hidden");
    $("f-buttons").classList.add("hidden");
    $("f-hint").classList.remove("hidden");
    session.flipped = false;
    replayAnim($("flash-card"));
  }
  function flip() {
    if (session.flipped) return;
    session.flipped = true;
    $("f-answer").classList.remove("hidden");
    $("f-buttons").classList.remove("hidden");
    $("f-hint").classList.add("hidden");
  }
  function flashGrade(correct) {
    if (!session.flipped || session.answered) return;
    answer(correct);
    next();
  }
  $("flash-card").onclick = flip;
  $("f-yes").onclick = () => flashGrade(true);
  $("f-no").onclick = () => flashGrade(false);

  // ----- quiz -----
  function answerText(card, dir) { return dir === "ru-it" ? card.it : card.ru; }

  function renderQuiz() {
    const s = session, c = s.card;
    const p = promptOf(c, s.dir);
    $("q-prompt").textContent = p.q;
    $("q-pron").textContent = p.qPron;
    const correctText = answerText(c, s.dir);
    const used = new Set([correctText]);
    const distractors = [];
    for (const o of shuffle(cards.slice())) {
      const t = answerText(o, s.dir);
      if (used.has(t)) continue;
      used.add(t); distractors.push(t);
      if (distractors.length === 3) break;
    }
    const options = shuffle([correctText].concat(distractors));
    const box = $("q-opts");
    box.innerHTML = "";
    options.forEach((t, i) => {
      const b = document.createElement("button");
      const k = document.createElement("kbd"); k.textContent = (i + 1) + ".";
      b.appendChild(k); b.appendChild(document.createTextNode(t));
      b.dataset.correct = t === correctText ? "1" : "";
      b.onclick = () => choose(b);
      box.appendChild(b);
    });
    $("q-feedback").classList.add("hidden");
    $("q-next-row").classList.add("hidden");
    replayAnim($("quiz-card"));
  }

  function choose(btn) {
    if (session.answered) return;
    const correct = btn.dataset.correct === "1";
    $("q-opts").querySelectorAll("button").forEach(b => {
      b.disabled = true;
      if (b.dataset.correct) b.classList.add("good");
    });
    if (!correct) btn.classList.add("bad");
    const c = session.card;
    $("q-feedback").textContent = c.ru + (c.pron ? "  —  " + c.pron : "");
    $("q-feedback").classList.remove("hidden");
    $("q-next-row").classList.remove("hidden");
    answer(correct);
  }
  $("q-next").onclick = () => { if (session && session.answered) next(); };

  // ---------- summary ----------
  function finish() {
    const s = session;
    updateProgress();
    $("sum-score").textContent = s.correct + " / " + s.total;
    $("sum-text").textContent = s.missed.size
      ? "Parole da rivedere:"
      : "Perfetto, nessun errore! 🎉";
    const ul = $("sum-missed");
    ul.innerHTML = "";
    s.missed.forEach(c => {
      const li = document.createElement("li");
      const b = document.createElement("b"); b.textContent = c.ru;
      const sm = document.createElement("small"); sm.textContent = "  " + c.pron;
      li.appendChild(b); li.appendChild(sm);
      li.appendChild(document.createElement("br"));
      li.appendChild(document.createTextNode(c.it));
      ul.appendChild(li);
    });
    session = null;
    show("summary");
  }
  $("back-menu").onclick = () => { renderMenu(); show("menu"); };

  // ---------- keyboard ----------
  document.addEventListener("keydown", e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (current === "summary" && e.key === "Enter") { e.preventDefault(); $("back-menu").click(); return; }
    if (current !== "session" || !session) return;
    if (session.mode === "flash") {
      if (e.key === " " || e.key === "Enter") { e.preventDefault(); flip(); }
      else if (e.key === "1") flashGrade(false);
      else if (e.key === "2") flashGrade(true);
    } else {
      if (/^[1-4]$/.test(e.key)) {
        const b = $("q-opts").querySelectorAll("button")[+e.key - 1];
        if (b) choose(b);
      } else if (e.key === "Enter" && session.answered) { e.preventDefault(); next(); }
    }
  });

  // ---------- init ----------
  if (cards.length) { renderMenu(); show("menu"); }
  else show("load");
})();
</script>
</body>
</html>
